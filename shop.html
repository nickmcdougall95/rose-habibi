<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Rose Habibi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">Rose Habibi</div>

    

    <nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="#">Services</a>
  <a href="#">About</a>
  <a href="#">Cart (<span id="cart-count">0</span>)</a>
</nav>
  </header>

  <section class="shop-hero">
    <p class="eyebrow">Luxury Swimwear & Fashion Services</p>
    <h1>Shop the Rose Habibi Collection</h1>
    <p>Bikinis, cover-ups, accessories, model services, boutique packages, and white-label products.</p>
  </section>

  <div class="filters">

<button onclick="filterProducts('All')">
All
</button>

<button onclick="filterProducts('Bikinis')">
Bikinis
</button>

<button onclick="filterProducts('Cover Ups')">
Cover Ups
</button>

<button onclick="filterProducts('Services')">
Services
</button>

</div>

  <section id="products" class="products-grid"></section>

  <section class="cart-section">
  <h2>Your Cart</h2>

  <div id="cart-items">
    <p>Your cart is empty.</p>
  </div>

  <h3>Total: $<span id="cart-total">0</span></h3>

  <div class="coupon-section">

  <input
    type="text"
    id="coupon-code"
    placeholder="Enter Discount Code"
  >

  <button onclick="applyCoupon()">
    Apply
  </button>

</div>

<p id="coupon-message"></p>

  <button class="checkout-btn">Checkout</button>
</section>

  <script src="script.js"></script>
</body>
</html>
